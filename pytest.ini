# LatentLens pytest configuration
# Comprehensive testing setup for the hybrid recommendation system

[tool:pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    api: API endpoint tests
    ml: Machine learning algorithm tests
    performance: Performance and scalability tests
    cold_start: Cold start scenario tests
    slow: Tests that take longer than 30 seconds
    fast: Tests that complete in under 5 seconds
    regression: Regression tests for known issues
    smoke: Basic functionality smoke tests
    
# Test filtering options
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::FutureWarning

# Minimum test versions
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Test data configuration
norecursedirs = 
    .git
    .github
    .vscode
    __pycache__
    .pytest_cache
    htmlcov
    .coverage
    mlruns
    LatentLens.egg-info
