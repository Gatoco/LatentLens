# Nombre del workflow, visible en la UI de GitHub Actions.
name: LatentLens CI

# Define los eventos que dispararán la ejecución de este workflow.
on:
  # Se activa en cualquier 'push' a la rama 'main'.
  push:
    branches: [ main ]
  # Se activa cuando se crea o actualiza un 'Pull Request' dirigido a 'main'.
  pull_request:
    branches: [ main ]

# Define el conjunto de trabajos a ejecutar.
jobs:
  # Identificador único para nuestro trabajo.
  build-and-test:
    # Define el tipo de máquina virtual que GitHub proveerá para ejecutar el trabajo.
    # 'ubuntu-latest' es el estándar recomendado.
    runs-on: ubuntu-latest

    # Define la secuencia de pasos que componen el trabajo.
    steps:
      # --- Paso 1: Checkout del Código ---
      # Utiliza una acción predefinida de GitHub (actions/checkout)
      # para clonar el código del repositorio en la máquina virtual.
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Paso 2: Construcción de la Imagen de Docker ---
      # Ejecuta un comando de shell estándar para construir la imagen.
      # -t asigna un nombre (tag) a la imagen para referenciarla después.
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag latentlens:latest

      # --- Paso 3: Ejecución de Tests dentro del Contenedor ---
      # Ejecuta la suite de tests (pytest) dentro de un nuevo contenedor
      # creado a partir de la imagen del paso anterior. Esto garantiza que
      # los tests se ejecuten en un entorno idéntico al de producción.
      # --rm elimina el contenedor automáticamente después de que termina.
      - name: Run tests with pytest
        run: docker run --rm latentlens:latest python -m pytest
